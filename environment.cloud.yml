# ============================================================================
# environment.cloud.yml -- FALLBACK ONLY, NOT USED FOR ANY PUBLISHED RESULT
# ----------------------------------------------------------------------------
# Every campaign in the dissertation ran on environment.yml, the pinned export
# from the validated WSL (Windows Subsystem for Linux) machine. The Dockerfile
# copies environment.yml, so the AWS host and wks720 ran the same environment.
# Nothing in this file produced a number that appears in the thesis.
#
# Use THIS file only if that pinned export fails to solve on a new machine,
# which is expected in time: conda-forge removes old build hashes. It installs
# current versions of the same stack, unpinned, so it will solve when the
# pinned file no longer does.
#
# The Python pin below is deliberately the same series as environment.yml.
# Do not lower it: a different interpreter series changes the compiled wheels
# under OpenMC and scikit-learn, and the results stop being comparable.
#
# Reference versions of the published runs, to check against after a fallback
# build: Python 3.13.13, OpenMC 0.15.3, pymoo 0.6.2, scikit-learn 1.9.0.
# After falling back, re-run the smoke test and re-check the reference case
# (pin-cell and assembly k_inf) against the validated baseline before trusting
# a full run.
#
#   mamba env create -n openmc-env -f environment.cloud.yml
# ============================================================================
name: openmc-env
channels:
  - conda-forge
dependencies:
  - python=3.13
  - openmc                # Open source Monte Carlo particle transport code
  - numpy
  - scipy
  - matplotlib
  - h5py
  - pandas
  - scikit-learn          # GP (Gaussian Process) + MLP (Multi-Layer Perceptron) surrogates
  - pymoo                 # NSGA-II (Non-Dominated Sorting Genetic Algorithm II)
  - pip
  - pip:
      - pyDOE2            # LHS (Latin Hypercube Sampling)
      - moocore           # hypervolume computation
      - cma
      - autograd
